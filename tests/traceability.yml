# Traceability matrix (plan §16.1, §16.3): every guarantee, hazard, FMEA row and attack
# mapped to the tests that cover it. Checked by tests/test_traceability.py.
#
# tests: pytest node ids ("tests/test_x.py::test_name") or "TODO" while none exist yet.
# TODO rows are reported as gaps; any other entry must name a test that exists.
# Hazard and FMEA ids must match docs/testing/hazards.md and docs/testing/fmea.md exactly.
# Attack ids follow the catalog in plan §15.3 (later: eval/adversarial/<component>/<attack>/).


name: Feature request
description: Suggest something AgentVC should do
labels: ["feature", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What were you trying to do, and what got in the way? Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or workarounds you tried.
  - type: checkboxes
    id: scope
    attributes:
      label: Fit
      options:
        - label: This keeps AgentVC local-first, with no runtime dependencies and no model calls
        - label: I'd like to help build it once contributions open

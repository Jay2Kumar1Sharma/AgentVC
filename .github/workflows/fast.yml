# Fast lane (plan §6.2, §16.5): lint, types and fast tests on every push and PR,
# on Linux, macOS and Windows with the oldest and newest supported Python.
name: Fast lane

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install AgentVC with dev tools
        run: python -m pip install -e ".[dev]"

      - name: Fast lane (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: make fast

      - name: Fast lane (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./make.ps1 fast
